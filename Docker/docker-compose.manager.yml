# DockTor, installed beside the stacks it manages.
#     docker compose -f 'APK:PODS/Docktor/Docker/docker-compose.manager.yml' up -d --build
#     open http://localhost:8765/
# ONE SERVICE, AND THE ONLY ONE IN THIS REPOSITORY THAT HOLDS THE DOCKER SOCKET:
# every other stack runs a workload, this one runs the tool that looks at them.
# Three mounts, and the third is the host network stack.
# ── MOUNT 1: THE SOCKET. /var/run/docker.sock has no colon, which is the only
# reason the short form can name it. It is root on the host and the container
# therefore runs as root — a container with this socket can start any container
# as any user, so the mount IS the privilege and `user:` would not reduce it.
# ── MOUNT 2: THE REPOSITORY, AT ITS OWN HOST PATH. `docker compose build` hands
# the DAEMON a context path, and the daemon is the host — so a compose file this
# container names at /app/… is a directory the daemon cannot see. Binding the
# checkout at the SAME absolute path on both sides makes every path this
# container passes resolve to the same bytes.
# SOURCE AND TARGET ARE ONE VARIABLE for that reason, and it has NO DEFAULT: a
# default of `../..` would mount the checkout where the daemon does not share it,
# and every `up` would fail on a context directory instead of the one thing that
# is wrong.
# ⚠️ THE CHECKOUT ROOT IS THE ONLY PATH HERE A BIND CAN NAME — every directory
#    under it carries a `:` and compose mount parser splits on it in both forms.
#    Bind the root, never something inside it.
# WITHOUT THIS MOUNT THE MANAGER STILL RUNS: reads, restart, logs and remove all
# work off the socket alone, and `up`/`rebuild` fail naming the compose file they
# could not find. That is a legitimate way to run it on a machine that watches.
# ── THE PROJECT: `apk-audio`, so the manager clumps with the ecosystem. It
# declares no volume, so the pinned-name rule has nothing to bite on. It is
# still an ORPHAN of every other file in the project: do not add
# --remove-orphans to an `up` of one of them.
name: apk-audio

services:
  manager:
    build:
      context: "../../.."                                          # repo root
      # ⚠️ REAL PATH, AND IT IS `APK:Docktor`. This said `APK:PODS/Docktor`, a
      # directory that has never existed, so every mount of this stack died on
      # `lstat .../APK:PODS/Docktor: no such file or directory` — including the
      # remount button on the dashboard's own row. The CONTEXT above is right as
      # it stands: this file is one rung under APK:PODS, so `../../..` is the
      # checkout root, which is what the dockerfile path below is relative to.
      dockerfile: "PODS/Docktor/Docker/Dockerfile.manager"
    image: docktor:local
    container_name: DockTor
    restart: unless-stopped
    # ── MOUNT 3, AND IT IS A MOUNT: THE HOST OWN NETWORK STACK. endpoints.sh
    # is the one copy of the port table and every address in it is written
    # `localhost`, because the person reading the dashboard is on the host.
    # Bridged, this container localhost is this container: every probe in
    # apps.sh went to a loopback with nothing on it, so the grid painted `down`
    # across a bench that was entirely healthy.
    # A host-gateway alias does NOT fix that: it reaches ports published on
    # 0.0.0.0 and nothing else, and the addresses that matter most here are
    # bound to the host LOOPBACK on purpose — the node supervisor, every NMOS
    # port, and this manager itself.
    # So the manager joins the host network stack and `localhost` means what it
    # says on both sides. Nothing is published, because there is no boundary
    # left to publish across.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: "${APKAUDIO_REPO:?set APKAUDIO_REPO to the checkout root, or start this with 'docker scripts/manager.sh up'}"
        target: "${APKAUDIO_REPO}"
        # ⚠️ `bind:` IS LOAD-BEARING: compose 2.40 re-serialises a long-form
        #    bind back into source:target:mode UNLESS the mount carries this
        #    sub-key, and a checkout path holding a colon is then refused.
        #    `rprivate` is the default propagation and only selects which daemon
        #    API carries the mount. check.sh compose-binds holds this at zero.
        bind:
          propagation: rprivate
      # LOGGER STORAGE: APK:Documentation/LOGS on the host. See the volumes:
      # block at the bottom for why THIS file does not declare it external.
      - type: volume
        source: apk-audio-logs
        target: /logs
      # DOCKTOR'S OWN STORAGE, and the reason the VOLUMES tab can draw a series
      # at all: the sampler writes volume-history.jsonl in here every five
      # minutes, and an image is not somewhere to keep it — the next rebuild
      # would be the end of the history of what the disk has been doing.
      # A NAMED VOLUME BOUND TO A FOLDER, not a bind: as a bind this would not
      # appear in `docker volume ls` at all, and the tab whose subject is the
      # volume table would be keeping its own state outside it.
      - type: volume
        source: docktor-storage
        target: /storage
    environment:
      # ⚠️ LOOPBACK, AND NOW THE ONLY THING HOLDING THE LINE. This API stops
      #    containers, rebuilds images and force-kills the bench with no
      #    authentication. Bridged, the ports: mapping bound it to 127.0.0.1 and
      #    the image 0.0.0.0 default was safe behind the container boundary. On
      #    the host network there is no boundary and no mapping: this line IS
      #    what the socket gets, so widening it hands the bench to the LAN.
      APK_MANAGER_BIND: 127.0.0.1
      APK_MANAGER_PORT: 8765
      # Read by bus.py and handed to mqtt_broker_discovery.candidates() as the
      # `configured` broker — the slot that exists for "this shop named its own".
      # 127.0.0.1 BECAUSE THE MANAGER IS ON THE HOST STACK NOW. It was
      # host.docker.internal while this container had a network of its own;
      # without the alias every broadcast failed with ECONNREFUSED against a
      # broker that was up, and failed quietly.
      MQTT_HOST: "${MQTT_HOST:-127.0.0.1}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      # THE OPERATOR HALF OF THE DOUBLE OPT-IN, TYPED HERE ON PURPOSE.
      # candidates() reaches a public broker only when the CALLER passes
      # allow_public AND this variable is set. report.py is the caller and also
      # asks for public_first, so with this line the manager status report goes
      # to test.mosquitto.org FIRST and the bench own broker second.
      # WHY FOR THIS CONTAINER AND NOWHERE ELSE: the audience is the DataBus
      # display PUBLIC pane, served from apk.audio, which cannot reach this
      # bench at all — and a local broker that is DOWN is the state that page
      # most needs told, which is precisely when a local-first order published
      # nothing. The telemetry probes pass no allow_public, so this variable
      # cannot put a puck on a desk or a hardware inventory on a public bus
      # however it is exported. Do not promote it to a shell profile.
      # WHAT LEAVES: container names, statuses and published host ports. Unset
      # this and the manager is local-only again; the broker own bridge still
      # relays the same topic, and stopping THAT is a separate act.
      APK_ALLOW_PUBLIC_BROKERS: "${APK_ALLOW_PUBLIC_BROKERS:-1}"
      # THE COMPOSE FILES RUN BY THIS CONTAINER ARE THE ONES UNDER THE BOUND
      # CHECKOUT, not the ones COPYed into the image — and the working directory
      # does not decide that, because _common.sh walks up from its OWN location
      # and the copy the manager runs lives at /app. So the repo path is handed
      # in as well as mounted: _common.sh prefers it over the walk, and every
      # path it gives the daemon is a host path the daemon can resolve.
      APKAUDIO_REPO: "${APKAUDIO_REPO}"
      # THE NODE'S ROLE HAS TO CROSS THE BOUNDARY TOO. Every plugin container
      # is behind a compose profile named for its role, and the buttons on the
      # dashboard run up-stack.sh IN HERE — so a role narrowed at the terminal
      # that stopped at the container door would leave the page starting a
      # different set of plugins than the same verb does from a host shell.
      # Blank is not "no roles": _common.sh reads an empty value as unset and
      # falls back to its own default, the README's "the lot".
      APKAUDIO_PLUGIN_ROLES: "${APKAUDIO_PLUGIN_ROLES:-}"
      APKAUDIO_UID: "${APKAUDIO_UID:-1000}"
      APKAUDIO_GID: "${APKAUDIO_GID:-1000}"
      APKAUDIO_LOG_DIR: /logs/DockTor
    working_dir: "${APKAUDIO_REPO}"
    healthcheck:
      # The API own account of itself, which answers before docker is asked — so
      # this separates "the server is up" from "docker is reachable", and a
      # daemon that has gone away shows as an unhealthy BENCH.
      # AND IT HAS TO BE *THIS* MANAGER ANSWERING: on the host network stack
      # 127.0.0.1:8765 is the bench loopback, so a manager started at a terminal
      # answers this probe exactly as well as the server in here would — and used
      # to, while this container sat waiting for a port it could not have.
      # `instance` carries who answered, and its pid is resolvable in OUR /proc
      # only when the answer came from inside this pid namespace. Both halves,
      # because either alone is a coincidence away from passing.
      test: ["CMD", "python3", "-c",
             "import json,os,urllib.request;i=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=4)).get('instance') or {};raise SystemExit(0 if i.get('containerised') and os.path.exists('/proc/%d' % i['pid']) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# LOGGER STORAGE. Every other stack declares this `external: true` and needs
# DATABSE:volume:Log STORAGE up first. NOT HERE: the manager is what brings that
# stack back, so it must be able to start on a bench where the volume does not
# exist yet. Same name, same bind — whichever file creates it first, both mount
# the one APK:Documentation/LOGS.
volumes:
  apk-audio-logs:
    name: apk-audio-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${APKAUDIO_REPO}/Documentation/LOGS"
  # THE SAME CONSTRUCTION, ONE FOLDER ACROSS — and the colons in the path are
  # fine HERE for the reason they are fine above: `device` is a string handed
  # to the local driver, not a mount spec compose splits on. The folder is
  # created by docker scripts/storage-volume.sh, which is also the one place
  # this name and this path are spelled for everything that is not compose.
  # ⚠️ AN EXISTING VOLUME IS NEVER RE-POINTED by editing this line: docker
  #    keeps the device it was created with, so a moved folder means
  #    `docker volume rm docktor-storage` and losing what is under the old one.
  docktor-storage:
    name: docktor-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${APKAUDIO_REPO}/Documentation/STORAGE/DockTor"
